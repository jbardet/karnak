name: Converted from DicomAnonymizer_Whitelist_extended_private
version: '1.0'
minimumKarnakVersion: 0.9.2
profileElements:
- name: Exclude SR and SC modalities
  codename: expression.on.tags
  arguments:
    expr: '((getString(#Tag.Modality) ?: '''').contains(''SR'') || (getString(#Tag.Modality)
      ?: '''').contains(''SC'')) ? ExcludeInstance() : null'
  tags:
  - (0008,0060)
- name: Exclude by image type flags
  codename: expression.on.tags
  arguments:
    expr: '(getString(#Tag.ImageType) ?: '''').matches(''.*(SCREEN SAVE|DISPLAY|LOCALIZER|OTHER).*'')
      || ((getString(#Tag.ImageType) ?: '''').contains(''SECONDARY'') && (getString(#Tag.Modality)
      ?: '''').matches(''(?i)CT|PET'')) ? ExcludeInstance() : null'
  tags:
  - (0008,0008)
- name: Exclude scout/localizer protocols
  codename: expression.on.tags
  arguments:
    expr: '(getString(#Tag.ProtocolName) ?: '''').matches(''(?i).*(scout|localizer).*'')
      ? ExcludeInstance() : null'
  tags:
  - (0018,1030)
- name: Exclude by series description
  codename: expression.on.tags
  arguments:
    expr: '(getString(#Tag.SeriesDescription) ?: '''').matches(''(?i).*(morpho|DEV|report|AAhead|rapid|KEY_IMAGES).*'')
      ? ExcludeInstance() : null'
  tags:
  - (0008,103E)
- name: Exclude burned-in annotation
  codename: expression.on.tags
  arguments:
    expr: '!''NO''.equalsIgnoreCase(getString(#Tag.BurnedInAnnotation)) ? ExcludeInstance()
      : null'
  tags:
  - (0028,0301)
