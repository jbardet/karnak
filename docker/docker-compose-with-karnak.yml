services:
  karnak:
    container_name: karnak
    image: osirixfoundation/karnak:master
    ports:
      - "11119:11119"
      - "8080:8081"
    volumes:
      - ./processed-dicoms:/app/archive
      # Mount logs directory to access timing logs from host
      - ./karnak-logs:/app/logs
    environment:
      KARNAK_WAIT_FOR: karnak-db:5432
      REDIS_HOST: karnak-cache
      GATEWAY_ARCHIVE_STORAGE_PATH: /app/archive
      # Timing log configuration
      KARNAK_TIMING_LOGS_MAX_FILE_SIZE: 50MB
      KARNAK_TIMING_LOGS_MAX_INDEX: 5
      KARNAK_LOGS_MAX_FILE_SIZE: 100MB
      KARNAK_LOGS_MAX_INDEX: 10
    env_file: karnak.env
    depends_on:
      - karnak-db
      - karnak-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
    secrets:
      - postgres_karnak_password
      - karnak_login_password
    networks:
      - karnak-data
      - karnak-network

  karnak-cache:
    container_name: karnak-cache
    image: redis:7-alpine
    networks:
      - karnak-data

  karnak-db:
    container_name: karnak-db
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=karnak
      - POSTGRES_USER=karnak
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_karnak_password
    volumes:
      - karnak-db-data:/var/lib/postgresql/data
    secrets:
      - postgres_karnak_password
    networks:
      - karnak-data

secrets:
  karnak_login_password:
    file: secrets/karnak_login_password
  postgres_karnak_password:
    file: secrets/karnak_postgres_password
  oidc_client_secret:
    file: secrets/oidc_client_secret

volumes:
  karnak-db-data:

networks:
  karnak-data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  karnak-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.1.0/24
          gateway: 172.19.1.1
