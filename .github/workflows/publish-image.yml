name: Publish Docker image

# Builds the forked Karnak (upstream + REST API endpoints) and pushes it to
# Docker Hub as jbardet97/karnak-endpoints. Triggered by tags following the
# <upstream-version>-api.<n> scheme (e.g. 1.1.1-api.2), or manually.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  (jbardet97)
#   DOCKERHUB_TOKEN     (Docker Hub access token with write scope)

on:
  push:
    tags:
      - "*-api.*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # No ":latest": it pointed at a v1.x image (1.1.1-api.5), and a v2 image refuses to
          # start on a v1 database. Deployments pin a digest; nothing should follow a moving tag.
          tags: |
            jbardet97/karnak-endpoints:${{ github.ref_name }}

      - name: Print image digest
        run: |
          docker buildx imagetools inspect \
            "jbardet97/karnak-endpoints:${{ github.ref_name }}" \
            --format '{{json .Manifest.Digest}}'
