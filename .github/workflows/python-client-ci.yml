name: python-client CI

on:
  push:
    paths:
      - "python-client/**"
      - ".github/workflows/python-client-ci.yml"
  pull_request:
    paths:
      - "python-client/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = TMLCTP harness floor; 3.13 = MiCo DAG containers.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: pip install -e "python-client[dev]"
      - name: Run tests
        run: pytest python-client/tests -q
